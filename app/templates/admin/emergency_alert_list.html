{%  extends "admin/admin2.html" %}
{% block content %}
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-header">
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
                    <h4 class="card-title">Emergency Alert Message List</h4>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table
                        id="basic-datatables"
                        class="display table table-striped table-hover"
                      >

                      <thead>
                        <tr>
                            <th>ID</th>
                            <th>Alert Message</th>
                            <th>Uploaded On</th>
                        </tr>
                      </thead>
                          <tbody>
                            {% for result in results %}
                            <tr>
                              <td>{{ result.id }}</td>
                              <td>{{ result.alert_message }}</td>
                              <td>{{ result.current_date }}</td>
                              <td><a href="{% url 'EditEmergencyAlert' result.id %}" title="Edit alert message"><i class="bi bi-pencil-square"></i></a></td>
                              <td><a href="{% url 'DeleteEmergencyAlert' result.id %}" title="Delete alert message"><i class="bi bi-trash3-fill"></i></a></td>
                            </tr>
                            {% endfor %}
                          </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
              </div>              
            </div>
{% endblock %}
